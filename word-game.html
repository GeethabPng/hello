<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Adventure - משחק לימוד מילים</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --pink: #ff6b9d; --purple: #c44dff; --blue: #4d9fff;
            --green: #4dff88; --yellow: #ffd84d; --orange: #ff914d;
            --bg: #1a1a2e; --card: #16213e;
        }
        body {
            font-family: 'Rubik', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .bg-stars { position: fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:0; }
        .bg-stars .star {
            position: absolute; width:3px; height:3px; background:#fff; border-radius:50%;
            animation: twinkle var(--dur) ease-in-out infinite; opacity:0;
        }
        @keyframes twinkle {
            0%,100% { opacity:0; transform:scale(0.5); }
            50% { opacity:var(--op); transform:scale(1); }
        }
        .container { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:20px; }

        /* Header */
        .header { text-align:center; padding:20px 0; }
        .header h1 {
            font-size:2.5em; font-weight:900;
            background:linear-gradient(135deg,var(--pink),var(--purple),var(--blue));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            margin-bottom:5px;
        }
        .header .subtitle { font-size:1.1em; color:#aab; }

        /* Stats bar */
        .stats-bar {
            display:flex; justify-content:center; gap:30px; padding:15px;
            background:var(--card); border-radius:16px; margin-bottom:20px;
            border:1px solid rgba(255,255,255,0.1);
        }
        .stat { text-align:center; }
        .stat-value { font-size:1.8em; font-weight:900; }
        .stat-label { font-size:0.8em; color:#889; }
        .stat-stars .stat-value { color:var(--yellow); }
        .stat-streak .stat-value { color:var(--orange); }
        .stat-words .stat-value { color:var(--blue); }

        /* Screens */
        .screen { display:none; }
        .screen.active { display:block; }

        /* Menu grid */
        .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px; }
        .menu-card {
            background:var(--card); border-radius:20px; padding:30px 20px; text-align:center;
            cursor:pointer; border:2px solid transparent; transition:all 0.3s ease;
            position:relative; overflow:hidden;
        }
        .menu-card::before {
            content:''; position:absolute; top:0;left:0;right:0; height:4px;
            background:var(--accent); border-radius:20px 20px 0 0;
        }
        .menu-card:hover:not(.locked) {
            transform:translateY(-5px); border-color:var(--accent);
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }
        .menu-card .icon { font-size:3em; margin-bottom:10px; }
        .menu-card .title { font-size:1.3em; font-weight:700; margin-bottom:5px; }
        .menu-card .desc { font-size:0.85em; color:#889; }
        .menu-card .method-status { font-size:0.8em; margin-top:8px; font-weight:600; }
        .menu-card:nth-child(1) { --accent:var(--pink); }
        .menu-card:nth-child(2) { --accent:var(--blue); }
        .menu-card:nth-child(3) { --accent:var(--green); }
        .menu-card:nth-child(4) { --accent:var(--purple); }
        .menu-card.locked { opacity:0.4; cursor:not-allowed; }
        .menu-card.completed { border-color:var(--green); }
        .menu-card.completed::after {
            content:''; position:absolute; top:10px; left:10px;
            font-size:1.5em;
        }

        /* Back button */
        .back-btn {
            background:rgba(255,255,255,0.1); border:none; color:#fff;
            padding:10px 20px; border-radius:12px; font-family:inherit;
            font-size:1em; cursor:pointer; margin-bottom:20px; transition:background 0.2s;
        }
        .back-btn:hover { background:rgba(255,255,255,0.2); }

        /* Stage select */
        .stage-header { text-align:center; margin-bottom:20px; }
        .stage-header .method-name { font-size:1.8em; font-weight:900; margin-bottom:5px; }
        .stage-header .method-desc { color:#889; }
        .stages-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
            gap:15px; margin-top:15px;
        }
        .stage-card {
            background:var(--card); border-radius:16px; padding:20px 15px;
            text-align:center; cursor:pointer; border:2px solid rgba(255,255,255,0.1);
            transition:all 0.3s;
        }
        .stage-card:hover:not(.locked) {
            transform:translateY(-3px); border-color:var(--blue);
        }
        .stage-card .stage-num { font-size:2em; font-weight:900; margin-bottom:5px; }
        .stage-card .stage-info { font-size:0.8em; color:#889; }
        .stage-card .stage-score { font-size:0.75em; color:var(--yellow); margin-top:5px; }
        .stage-card.locked { opacity:0.35; cursor:not-allowed; }
        .stage-card.current { border-color:var(--yellow); box-shadow:0 0 15px rgba(255,216,77,0.3); }
        .stage-card.completed { border-color:var(--green); }
        .stage-card.completed .stage-num { color:var(--green); }

        /* Progress bar */
        .progress-bar {
            background:rgba(255,255,255,0.1); border-radius:10px;
            height:8px; margin-bottom:20px; overflow:hidden;
        }
        .progress-fill {
            height:100%; border-radius:10px;
            background:linear-gradient(90deg,var(--pink),var(--purple));
            transition:width 0.3s ease;
        }

        /* Stage info bar */
        .stage-info-bar {
            display:flex; justify-content:space-between; align-items:center;
            background:var(--card); border-radius:12px; padding:10px 20px;
            margin-bottom:15px; font-size:0.9em;
        }
        .stage-info-bar .info-right { color:var(--yellow); font-weight:600; }

        /* Quiz mode */
        .quiz-prompt {
            text-align:center; padding:30px; background:var(--card);
            border-radius:20px; margin-bottom:20px;
        }
        .quiz-prompt .label { font-size:0.9em; color:#889; margin-bottom:8px; }
        .quiz-prompt .hebrew-word { font-size:2.5em; font-weight:900; color:var(--yellow); }
        .quiz-prompt .emoji-hint { font-size:2em; margin-top:10px; }
        .quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        .quiz-option {
            background:var(--card); border:2px solid rgba(255,255,255,0.15);
            border-radius:16px; padding:20px; font-size:1.4em; font-weight:700;
            color:#fff; cursor:pointer; font-family:'Rubik',sans-serif;
            transition:all 0.2s; text-align:center; direction:ltr;
        }
        .quiz-option:hover { border-color:var(--blue); background:rgba(77,159,255,0.1); }
        .quiz-option.correct { border-color:var(--green); background:rgba(77,255,136,0.2); animation:correctPulse 0.5s ease; }
        .quiz-option.wrong { border-color:#ff4444; background:rgba(255,68,68,0.2); animation:shake 0.4s ease; }
        @keyframes correctPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

        /* Scramble mode */
        .scramble-display {
            text-align:center; padding:30px; background:var(--card);
            border-radius:20px; margin-bottom:20px;
        }
        .scramble-display .hebrew { font-size:1.8em; font-weight:700; color:var(--yellow); margin-bottom:15px; }
        .scramble-letters {
            display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
            direction:ltr; margin-bottom:20px;
        }
        .scramble-letter {
            width:50px; height:55px; background:linear-gradient(135deg,var(--purple),var(--blue));
            border:none; border-radius:12px; font-size:1.5em; font-weight:900; color:#fff;
            cursor:pointer; font-family:'Rubik',sans-serif; transition:all 0.2s; text-transform:uppercase;
        }
        .scramble-letter:hover { transform:scale(1.1); }
        .scramble-letter.used { opacity:0.3; transform:scale(0.9); pointer-events:none; }
        .scramble-letter.space-letter {
            background:transparent; border:2px dashed rgba(255,255,255,0.2);
            pointer-events:none; width:25px; font-size:0.8em; color:#889;
        }
        .answer-slots { display:flex; justify-content:center; gap:8px; direction:ltr; margin-bottom:15px; flex-wrap:wrap; }
        .answer-slot {
            width:50px; height:55px; background:rgba(255,255,255,0.08);
            border:2px dashed rgba(255,255,255,0.2); border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            font-size:1.5em; font-weight:900; text-transform:uppercase; cursor:pointer; transition:all 0.2s;
        }
        .answer-slot.filled { background:rgba(77,255,136,0.15); border-color:var(--green); color:var(--green); }
        .answer-slot.space-slot {
            width:25px; background:transparent; border:none; pointer-events:none;
            color:#556; font-size:1em;
        }
        .scramble-hint-btn {
            background:var(--orange); border:none; padding:8px 20px; border-radius:10px;
            color:#fff; font-family:inherit; font-size:0.9em; cursor:pointer; font-weight:600;
        }

        /* Catcher game */
        .catcher-area {
            position:relative; width:100%; height:450px; background:var(--card);
            border-radius:20px; overflow:hidden; margin-bottom:15px;
            border:2px solid rgba(255,255,255,0.1);
        }
        .catcher-target {
            text-align:center; padding:12px; font-size:1.1em; color:var(--yellow);
            font-weight:700; background:rgba(0,0,0,0.3); position:absolute;
            top:0;left:0;right:0; z-index:5;
        }
        .catcher-target span { font-size:1.4em; }
        .falling-word {
            position:absolute; padding:8px 18px; border-radius:12px; font-weight:700;
            font-size:1.1em; direction:ltr; white-space:nowrap; transition:none;
        }
        .player-basket {
            position:absolute; bottom:10px; width:100px; height:50px;
            background:linear-gradient(135deg,var(--pink),var(--purple));
            border-radius:15px 15px 20px 20px; display:flex; align-items:center;
            justify-content:center; font-size:1.8em; z-index:5; transition:left 0.05s linear;
        }
        .catcher-controls { display:flex; justify-content:center; gap:15px; }
        .catcher-ctrl-btn {
            background:var(--card); border:2px solid rgba(255,255,255,0.2); color:#fff;
            width:70px; height:55px; border-radius:14px; font-size:1.5em;
            cursor:pointer; transition:all 0.1s; user-select:none; -webkit-user-select:none;
        }
        .catcher-ctrl-btn:active { background:rgba(255,255,255,0.15); transform:scale(0.95); }

        /* Memory game */
        .memory-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
        .memory-card { aspect-ratio:1; perspective:600px; cursor:pointer; }
        .memory-card-inner {
            width:100%; height:100%; position:relative; transform-style:preserve-3d;
            transition:transform 0.4s ease; border-radius:14px;
        }
        .memory-card.flipped .memory-card-inner { transform:rotateY(180deg); }
        .memory-card-front, .memory-card-back {
            position:absolute; width:100%; height:100%; backface-visibility:hidden;
            border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:700;
        }
        .memory-card-front { background:linear-gradient(135deg,var(--purple),var(--blue)); font-size:2em; }
        .memory-card-back {
            background:var(--card); border:2px solid rgba(255,255,255,0.2);
            transform:rotateY(180deg); font-size:1.1em; padding:5px; text-align:center; word-break:break-word;
        }
        .memory-card-back.english { direction:ltr; color:var(--green); }
        .memory-card-back.hebrew { color:var(--yellow); }
        .memory-card.matched .memory-card-inner { transform:rotateY(180deg); }
        .memory-card.matched .memory-card-back { border-color:var(--green); background:rgba(77,255,136,0.1); }

        /* Results overlay */
        .results-overlay {
            position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.8);
            display:none; align-items:center; justify-content:center; z-index:200;
            flex-direction:column;
        }
        .results-overlay.active { display:flex; }
        .results-box {
            background:var(--card); border-radius:24px; padding:40px; text-align:center;
            max-width:400px; width:90%; border:2px solid rgba(255,255,255,0.1);
        }
        .results-box h2 { font-size:2em; margin-bottom:15px; }
        .results-box .score-display { font-size:3em; font-weight:900; margin:15px 0; }
        .results-box .score-display.pass { color:var(--green); }
        .results-box .score-display.fail { color:var(--orange); }
        .results-box .result-msg { color:#aab; font-size:1.1em; margin-bottom:20px; }
        .results-box .threshold-bar {
            background:rgba(255,255,255,0.1); border-radius:10px; height:12px;
            margin:15px 0; overflow:hidden; position:relative;
        }
        .results-box .threshold-fill {
            height:100%; border-radius:10px; transition:width 0.5s ease;
        }
        .results-box .threshold-mark {
            position:absolute; top:-5px; height:22px; width:2px;
            background:var(--yellow); left:80%;
        }
        .results-box .threshold-label {
            font-size:0.75em; color:#889; margin-bottom:15px;
            display:flex; justify-content:space-between;
        }
        .results-btn {
            background:linear-gradient(135deg,var(--pink),var(--purple)); border:none;
            padding:15px 40px; border-radius:14px; color:#fff; font-family:inherit;
            font-size:1.2em; font-weight:700; cursor:pointer; transition:transform 0.2s;
            margin:5px;
        }
        .results-btn:hover { transform:scale(1.05); }
        .results-btn.secondary {
            background:rgba(255,255,255,0.1);
        }

        /* Floating feedback */
        .floating-feedback {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size:4em; font-weight:900; z-index:100; pointer-events:none;
            animation:floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity:1; transform:translate(-50%,-50%) scale(0.5); }
            50% { opacity:1; transform:translate(-50%,-70%) scale(1.2); }
            100% { opacity:0; transform:translate(-50%,-100%) scale(1); }
        }

        /* Confetti */
        .confetti-piece {
            position:fixed; width:10px; height:10px; z-index:199;
            animation:confettiFall var(--dur) ease-in forwards;
        }
        @keyframes confettiFall {
            0% { transform:translateY(-10vh) rotate(0deg); opacity:1; }
            100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
        }

        /* Method complete celebration */
        .celebration {
            position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.7);
            display:none; align-items:center; justify-content:center; z-index:250;
            flex-direction:column;
        }
        .celebration.active { display:flex; }
        .celebration h2 { font-size:2.5em; margin-bottom:10px; animation:bounceIn 0.5s ease; }
        .celebration p { font-size:1.2em; color:#aab; margin-bottom:5px; }
        .celebration .next-info { color:var(--green); font-size:1.1em; font-weight:600; margin:10px 0 20px; }
        .celebration button {
            background:linear-gradient(135deg,var(--pink),var(--purple)); border:none;
            padding:15px 40px; border-radius:14px; color:#fff; font-family:inherit;
            font-size:1.2em; font-weight:700; cursor:pointer; transition:transform 0.2s;
        }
        .celebration button:hover { transform:scale(1.05); }
        @keyframes bounceIn { 0%{transform:scale(0);} 60%{transform:scale(1.2);} 100%{transform:scale(1);} }

        /* Responsive */
        @media (max-width:600px) {
            .header h1 { font-size:1.8em; }
            .menu-grid { grid-template-columns:1fr; }
            .quiz-options { grid-template-columns:1fr; }
            .quiz-prompt .hebrew-word { font-size:2em; }
            .memory-grid { grid-template-columns:repeat(3,1fr); }
            .stats-bar { gap:15px; flex-wrap:wrap; }
            .scramble-letter, .answer-slot { width:40px; height:45px; font-size:1.2em; }
            .catcher-area { height:350px; }
            .stages-grid { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>
<body>

<div class="bg-stars" id="bgStars"></div>

<div class="container">
    <div class="header">
        <h1>Word Adventure</h1>
        <div class="subtitle">הרפתקת המילים - לומדים אנגלית בכיף!</div>
    </div>

    <div class="stats-bar">
        <div class="stat stat-stars">
            <div class="stat-value" id="totalStars">0</div>
            <div class="stat-label">כוכבים</div>
        </div>
        <div class="stat stat-streak">
            <div class="stat-value" id="streak">0</div>
            <div class="stat-label">רצף</div>
        </div>
        <div class="stat stat-words">
            <div class="stat-value" id="wordsLearned">0</div>
            <div class="stat-label">מילים נלמדו</div>
        </div>
    </div>

    <!-- MENU SCREEN -->
    <div class="screen active" id="menuScreen">
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- STAGE SELECT SCREEN -->
    <div class="screen" id="stageScreen">
        <button class="back-btn" onclick="goToMenu()">&#8594; חזרה לתפריט</button>
        <div class="stage-header">
            <div class="method-name" id="stageMethodName"></div>
            <div class="method-desc" id="stageMethodDesc"></div>
        </div>
        <div class="stages-grid" id="stagesGrid"></div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen">
        <button class="back-btn" onclick="goToStages()">&#8594; חזרה לשלבים</button>
        <div class="stage-info-bar">
            <span id="quizStageLabel"></span>
            <span class="info-right" id="quizScoreLabel"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="quizProgress"></div></div>
        <div class="quiz-prompt">
            <div class="label">מה המילה באנגלית?</div>
            <div class="hebrew-word" id="quizHebrew"></div>
            <div class="emoji-hint" id="quizEmoji"></div>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
    </div>

    <!-- SCRAMBLE SCREEN -->
    <div class="screen" id="scrambleScreen">
        <button class="back-btn" onclick="goToStages()">&#8594; חזרה לשלבים</button>
        <div class="stage-info-bar">
            <span id="scrambleStageLabel"></span>
            <span class="info-right" id="scrambleScoreLabel"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="scrambleProgress"></div></div>
        <div class="scramble-display">
            <div class="label" style="color:#889;margin-bottom:8px;">סדר את האותיות:</div>
            <div class="hebrew" id="scrambleHebrew"></div>
            <div class="answer-slots" id="answerSlots"></div>
            <div class="scramble-letters" id="scrambleLetters"></div>
            <button class="scramble-hint-btn" onclick="scrambleHint()">רמז</button>
        </div>
    </div>

    <!-- CATCHER SCREEN -->
    <div class="screen" id="catcherScreen">
        <button class="back-btn" onclick="stopCatcher(); goToStages()">&#8594; חזרה לשלבים</button>
        <div class="stage-info-bar">
            <span id="catcherStageLabel"></span>
            <span class="info-right" id="catcherScoreLabel"></span>
        </div>
        <div class="catcher-area" id="catcherArea">
            <div class="catcher-target">תפוס: <span id="catcherTarget"></span></div>
            <div class="player-basket" id="playerBasket">&#x1F9FA;</div>
        </div>
        <div class="catcher-controls">
            <button class="catcher-ctrl-btn" id="btnLeft"
                ontouchstart="movePlayer('left',true)" ontouchend="movePlayer('left',false)"
                onmousedown="movePlayer('left',true)" onmouseup="movePlayer('left',false)">&#x2B05;&#xFE0F;</button>
            <button class="catcher-ctrl-btn" id="btnRight"
                ontouchstart="movePlayer('right',true)" ontouchend="movePlayer('right',false)"
                onmousedown="movePlayer('right',true)" onmouseup="movePlayer('right',false)">&#x27A1;&#xFE0F;</button>
        </div>
    </div>

    <!-- MEMORY SCREEN -->
    <div class="screen" id="memoryScreen">
        <button class="back-btn" onclick="goToStages()">&#8594; חזרה לשלבים</button>
        <div class="stage-info-bar">
            <span id="memoryStageLabel"></span>
            <span class="info-right" id="memoryScoreLabel"></span>
        </div>
        <div style="text-align:center;margin-bottom:15px;">
            <span style="color:#889;">מצא את הזוגות! התאם אנגלית &#x2190; עברית</span>
        </div>
        <div class="memory-grid" id="memoryGrid"></div>
    </div>
</div>

<!-- Results overlay -->
<div class="results-overlay" id="resultsOverlay">
    <div class="results-box">
        <h2 id="resultsTitle"></h2>
        <div class="score-display" id="resultsScore"></div>
        <div class="threshold-bar">
            <div class="threshold-fill" id="thresholdFill"></div>
            <div class="threshold-mark"></div>
        </div>
        <div class="threshold-label">
            <span>0%</span>
            <span style="color:var(--yellow)">80% - סף מעבר</span>
            <span>100%</span>
        </div>
        <div class="result-msg" id="resultsMsg"></div>
        <div id="resultsButtons"></div>
    </div>
</div>

<!-- Method complete celebration -->
<div class="celebration" id="celebration">
    <h2 id="celebrationTitle"></h2>
    <p id="celebrationMsg"></p>
    <div class="next-info" id="celebrationNext"></div>
    <button onclick="closeCelebration()">המשך</button>
</div>

<script>
// ========== WORD DATA ==========
const WORDS = [
    { en: "Apple", he: "תפוח", emoji: "\u{1F34E}" },

// ========== METHODS & STAGES CONFIG ==========
const METHODS = [
    { id: 'quiz', name: 'חידון מילים', icon: '\u{1F3AF}', desc: 'בחר את המילה הנכונה באנגלית', color: 'var(--pink)' },
    { id: 'scramble', name: 'אותיות מבולבלות', icon: '\u{1F524}', desc: 'סדר את האותיות למילה הנכונה', color: 'var(--blue)' },
    { id: 'catcher', name: 'תפוס מילה!', icon: '\u{1F9FA}', desc: 'תפוס את המילה הנכונה שנופלת', color: 'var(--green)' },
    { id: 'memory', name: 'זיכרון', icon: '\u{1F9E0}', desc: 'התאם מילים באנגלית ובעברית', color: 'var(--purple)' }
];

const WORDS_PER_STAGE = 11;
const PASS_THRESHOLD = 0.8;
const NUM_STAGES = Math.ceil(WORDS.length / WORDS_PER_STAGE);

function getStageWords(stageIdx) {
    const start = stageIdx * WORDS_PER_STAGE;
    return WORDS.slice(start, start + WORDS_PER_STAGE);
}

// ========== PROGRESS STATE ==========
let progress = {};
let totalStars = 0;
let streak = 0;
let wordsLearned = new Set();

function initProgress() {
    const p = {};
    METHODS.forEach((m, mi) => {
        p[m.id] = {
            unlocked: mi === 0,
            stages: []
        };
        for (let s = 0; s < NUM_STAGES; s++) {
            p[m.id].stages.push({ completed: false, bestScore: 0 });
        }
    });
    return p;
}

function loadState() {
    try {
        const saved = JSON.parse(localStorage.getItem('wordAdventure2') || '{}');
        if (saved.progress) {
            progress = saved.progress;
            // Make sure structure matches (in case words changed)
            METHODS.forEach((m, mi) => {
                if (!progress[m.id]) {
                    progress[m.id] = { unlocked: mi === 0, stages: [] };
                }
                while (progress[m.id].stages.length < NUM_STAGES) {
                    progress[m.id].stages.push({ completed: false, bestScore: 0 });
                }
            });
        } else {
            progress = initProgress();
        }
        totalStars = saved.stars || 0;
        wordsLearned = new Set(saved.words || []);
    } catch(e) {
        progress = initProgress();
    }
}

function saveState() {
    localStorage.setItem('wordAdventure2', JSON.stringify({
        progress,
        stars: totalStars,
        words: [...wordsLearned]
    }));
}

function updateStats() {
    document.getElementById('totalStars').textContent = totalStars;
    document.getElementById('streak').textContent = streak;
    document.getElementById('wordsLearned').textContent = wordsLearned.size;
}

loadState();
updateStats();

// ========== CURRENT GAME STATE ==========
let currentMethodIdx = 0;
let currentStageIdx = 0;
let stageCorrect = 0;
let stageTotal = 0;

function getCurrentStageWords() {
    return getStageWords(currentStageIdx);
}

function getFirstUnlockedStage(methodId) {
    const mp = progress[methodId];
    for (let i = 0; i < mp.stages.length; i++) {
        if (!mp.stages[i].completed) return i;
    }
    return mp.stages.length - 1;
}

function isMethodComplete(methodId) {
    return progress[methodId].stages.every(s => s.completed);
}

function isStageUnlocked(methodId, stageIdx) {
    if (stageIdx === 0) return true;
    return progress[methodId].stages[stageIdx - 1].completed;
}

// ========== HELPERS ==========
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function showFloatingFeedback(text) {
    const el = document.createElement('div');
    el.className = 'floating-feedback';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function playCorrectSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523, ctx.currentTime);
        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

function playWrongSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

// ========== NAVIGATION ==========
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function goToMenu() {
    renderMenu();
    showScreen('menuScreen');
}

function goToStages() {
    renderStages();
    showScreen('stageScreen');
}

// ========== MENU ==========
function renderMenu() {
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';
    METHODS.forEach((m, mi) => {
        const mp = progress[m.id];
        const locked = !mp.unlocked;
        const completed = isMethodComplete(m.id);
        const div = document.createElement('div');
        div.className = 'menu-card' + (locked ? ' locked' : '') + (completed ? ' completed' : '');
        const completedStages = mp.stages.filter(s => s.completed).length;

        let statusText = '';
        if (locked) statusText = '\u{1F512} נעול';
        else if (completed) statusText = '\u{2705} הושלם!';
        else statusText = 'שלב ' + (completedStages + 1) + ' מתוך ' + NUM_STAGES;

        div.innerHTML = '<div class="icon">' + m.icon + '</div>' +
            '<div class="title">' + m.name + '</div>' +
            '<div class="desc">' + m.desc + '</div>' +
            '<div class="method-status" style="color:' + (completed ? 'var(--green)' : locked ? '#666' : 'var(--yellow)') + '">' + statusText + '</div>';

        if (!locked) {
            div.onclick = function() {
                currentMethodIdx = mi;
                goToStages();
            };
        }
        grid.appendChild(div);
    });
}

// ========== STAGE SELECT ==========
function renderStages() {
    const m = METHODS[currentMethodIdx];
    const mp = progress[m.id];
    document.getElementById('stageMethodName').textContent = m.icon + ' ' + m.name;
    document.getElementById('stageMethodDesc').textContent = m.desc;

    const grid = document.getElementById('stagesGrid');
    grid.innerHTML = '';
    for (let i = 0; i < NUM_STAGES; i++) {
        const stage = mp.stages[i];
        const unlocked = isStageUnlocked(m.id, i);
        const words = getStageWords(i);
        const isCurrent = unlocked && !stage.completed;

        const div = document.createElement('div');
        div.className = 'stage-card' +
            (!unlocked ? ' locked' : '') +
            (stage.completed ? ' completed' : '') +
            (isCurrent ? ' current' : '');

        let numLabel = stage.completed ? '\u{2705}' : (!unlocked ? '\u{1F512}' : (i + 1));
        let scoreText = stage.bestScore > 0 ? ('שיא: ' + Math.round(stage.bestScore * 100) + '%') : '';

        div.innerHTML = '<div class="stage-num">' + numLabel + '</div>' +
            '<div class="stage-info">' + words.length + ' מילים</div>' +
            (scoreText ? '<div class="stage-score">' + scoreText + '</div>' : '');

        if (unlocked) {
            (function(si) {
                div.onclick = function() {
                    currentStageIdx = si;
                    stageCorrect = 0;
                    stageTotal = 0;
                    streak = 0;
                    updateStats();
                    startMethod(m.id);
                };
            })(i);
        }
        grid.appendChild(div);
    }
}

// ========== START METHOD ==========
function startMethod(methodId) {
    switch(methodId) {
        case 'quiz': startQuiz(); break;
        case 'scramble': startScramble(); break;
        case 'catcher': startCatcher(); break;
        case 'memory': startMemory(); break;
    }
}

// ========== FINISH STAGE ==========
function finishStage() {
    const m = METHODS[currentMethodIdx];
    const mp = progress[m.id];
    const pct = stageTotal > 0 ? stageCorrect / stageTotal : 0;
    const passed = pct >= PASS_THRESHOLD;

    // Update best score
    if (pct > mp.stages[currentStageIdx].bestScore) {
        mp.stages[currentStageIdx].bestScore = pct;
    }

    if (passed) {
        mp.stages[currentStageIdx].completed = true;

        // Check if all stages in this method are done
        if (isMethodComplete(m.id)) {
            // Unlock next method
            const nextMi = currentMethodIdx + 1;
            if (nextMi < METHODS.length) {
                progress[METHODS[nextMi].id].unlocked = true;
            }
        }
    }

    saveState();
    showResults(pct, passed);
}

function showResults(pct, passed) {
    const overlay = document.getElementById('resultsOverlay');
    const pctRound = Math.round(pct * 100);

    document.getElementById('resultsTitle').textContent = passed ? '\u{1F389} כל הכבוד!' : '\u{1F4AA} כמעט!';
    document.getElementById('resultsScore').textContent = pctRound + '%';
    document.getElementById('resultsScore').className = 'score-display ' + (passed ? 'pass' : 'fail');

    const fill = document.getElementById('thresholdFill');
    fill.style.width = '0%';
    fill.style.background = passed ? 'linear-gradient(90deg, var(--green), #00cc55)' : 'linear-gradient(90deg, var(--orange), var(--pink))';
    setTimeout(() => { fill.style.width = pctRound + '%'; }, 100);

    const m = METHODS[currentMethodIdx];

    if (passed) {
        const methodDone = isMethodComplete(m.id);
        if (methodDone && currentMethodIdx < METHODS.length - 1) {
            document.getElementById('resultsMsg').textContent =
                'סיימת את כל השלבים ב' + m.name + '! נפתח: ' + METHODS[currentMethodIdx + 1].name;
        } else if (methodDone) {
            document.getElementById('resultsMsg').textContent = 'סיימת את כל המשחק! מדהים!';
        } else {
            document.getElementById('resultsMsg').textContent = 'עברת את השלב! השלב הבא נפתח.';
        }
    } else {
        document.getElementById('resultsMsg').textContent =
            'צריך לפחות 80% כדי לעבור. נסה שוב!';
    }

    const btnsDiv = document.getElementById('resultsButtons');
    btnsDiv.innerHTML = '';

    if (passed) {
        showConfetti();
        playCorrectSound();

        const methodDone = isMethodComplete(m.id);
        if (methodDone) {
            const btn = document.createElement('button');
            btn.className = 'results-btn';
            btn.textContent = 'חזרה לתפריט';
            btn.onclick = function() { closeResults(); goToMenu(); };
            btnsDiv.appendChild(btn);
        } else {
            // Next stage button
            const btn = document.createElement('button');
            btn.className = 'results-btn';
            btn.textContent = 'לשלב הבא \u{25B6}';
            btn.onclick = function() {
                closeResults();
                currentStageIdx++;
                stageCorrect = 0;
                stageTotal = 0;
                streak = 0;
                updateStats();
                startMethod(m.id);
            };
            btnsDiv.appendChild(btn);

            const btn2 = document.createElement('button');
            btn2.className = 'results-btn secondary';
            btn2.textContent = 'חזרה לשלבים';
            btn2.onclick = function() { closeResults(); goToStages(); };
            btnsDiv.appendChild(btn2);
        }
    } else {
        const btn = document.createElement('button');
        btn.className = 'results-btn';
        btn.textContent = 'נסה שוב';
        btn.onclick = function() {
            closeResults();
            stageCorrect = 0;
            stageTotal = 0;
            streak = 0;
            updateStats();
            startMethod(m.id);
        };
        btnsDiv.appendChild(btn);

        const btn2 = document.createElement('button');
        btn2.className = 'results-btn secondary';
        btn2.textContent = 'חזרה לשלבים';
        btn2.onclick = function() { closeResults(); goToStages(); };
        btnsDiv.appendChild(btn2);
    }

    overlay.classList.add('active');
}

function closeResults() {
    document.getElementById('resultsOverlay').classList.remove('active');
}

function closeCelebration() {
    document.getElementById('celebration').classList.remove('active');

// ========== QUIZ MODE ==========
let quizWords, quizIndex, quizLocked;

function startQuiz() {
    showScreen('quizScreen');
    quizWords = shuffle(getCurrentStageWords());
    quizIndex = 0;
    document.getElementById('quizStageLabel').textContent =
        METHODS[currentMethodIdx].name + ' - שלב ' + (currentStageIdx + 1);
    updateQuizScore();
    showQuizQuestion();
}

function updateQuizScore() {
    document.getElementById('quizScoreLabel').textContent =
        stageCorrect + '/' + stageTotal;
}

function showQuizQuestion() {
    if (quizIndex >= quizWords.length) {
        finishStage();
        return;
    }
    quizLocked = false;
    const word = quizWords[quizIndex];
    document.getElementById('quizHebrew').textContent = word.he;
    document.getElementById('quizEmoji').textContent = word.emoji;
    document.getElementById('quizProgress').style.width =
        ((quizIndex / quizWords.length) * 100) + '%';

    let options = [word];
    const others = WORDS.filter(w => w.en !== word.en);
    const wrongOnes = shuffle(others).slice(0, 3);
    options = shuffle([...options, ...wrongOnes]);

    const container = document.getElementById('quizOptions');
    container.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt.en;
        btn.onclick = function() { quizAnswer(btn, opt.en === word.en, word.en); };
        container.appendChild(btn);
    });
}

function quizAnswer(btn, correct, wordEn) {
    if (quizLocked) return;
    quizLocked = true;
    stageTotal++;

    if (correct) {
        btn.classList.add('correct');
        showFloatingFeedback('\u{2B50}');
        playCorrectSound();
        streak++;
        stageCorrect++;
        addStars(streak >= 3 ? 3 : 1);
        markWordLearned(wordEn);
    } else {
        btn.classList.add('wrong');
        playWrongSound();
        showFloatingFeedback('\u{274C}');
        streak = 0;
        document.querySelectorAll('.quiz-option').forEach(b => {
            if (b.textContent === wordEn) b.classList.add('correct');
        });
    }
    updateStats();
    updateQuizScore();

    setTimeout(function() {
        quizIndex++;
        showQuizQuestion();
    }, 1200);
}

// ========== SCRAMBLE MODE ==========
let scrambleWords, scrambleIndex, scrambleAnswer, scrambleCurrent, scrambleSpaceIndices;

function startScramble() {
    showScreen('scrambleScreen');
    scrambleWords = shuffle(getCurrentStageWords());
    scrambleIndex = 0;
    document.getElementById('scrambleStageLabel').textContent =
        METHODS[currentMethodIdx].name + ' - שלב ' + (currentStageIdx + 1);
    updateScrambleScore();
    showScrambleWord();
}

function updateScrambleScore() {
    document.getElementById('scrambleScoreLabel').textContent =
        stageCorrect + '/' + stageTotal;
}

function showScrambleWord() {
    if (scrambleIndex >= scrambleWords.length) {
        finishStage();
        return;
    }
    const word = scrambleWords[scrambleIndex];
    scrambleAnswer = word.en.toUpperCase();
    scrambleCurrent = [];
    scrambleSpaceIndices = [];

    // Find space positions
    for (let i = 0; i < scrambleAnswer.length; i++) {
        if (scrambleAnswer[i] === ' ') scrambleSpaceIndices.push(i);
    }

    document.getElementById('scrambleHebrew').textContent = word.he + ' ' + word.emoji;
    document.getElementById('scrambleProgress').style.width =
        ((scrambleIndex / scrambleWords.length) * 100) + '%';

    // Create answer slots
    const slotsContainer = document.getElementById('answerSlots');
    slotsContainer.innerHTML = '';
    for (let i = 0; i < scrambleAnswer.length; i++) {
        const slot = document.createElement('div');
        if (scrambleAnswer[i] === ' ') {
            slot.className = 'answer-slot space-slot';
            slot.textContent = ' ';
        } else {
            slot.className = 'answer-slot';
            slot.dataset.index = i;
            slot.onclick = (function(idx) { return function() { removeFromSlot(idx); }; })(i);
        }
        slotsContainer.appendChild(slot);
    }

    // Create scrambled letters (only non-space characters)
    const lettersOnly = scrambleAnswer.split('').filter(c => c !== ' ');
    const shuffledLetters = shuffle(lettersOnly);
    const lettersContainer = document.getElementById('scrambleLetters');
    lettersContainer.innerHTML = '';
    shuffledLetters.forEach(function(letter, i) {
        const btn = document.createElement('button');
        btn.className = 'scramble-letter';
        btn.textContent = letter;
        btn.dataset.idx = i;
        btn.onclick = function() { addLetter(btn, letter, i); };
        lettersContainer.appendChild(btn);
    });
}

function getNextEmptySlotIdx() {
    // Find the next empty non-space slot index in the answer
    for (let i = 0; i < scrambleAnswer.length; i++) {
        if (scrambleAnswer[i] === ' ') continue;
        const slot = document.querySelectorAll('.answer-slot')[i];
        if (!slot.classList.contains('filled') && !slot.classList.contains('space-slot')) return i;
    }
    return -1;
}

function getFilledCount() {
    let count = 0;
    document.querySelectorAll('.answer-slot').forEach(s => {
        if (s.classList.contains('filled')) count++;
    });
    return count;
}

function addLetter(btn, letter, idx) {
    if (btn.classList.contains('used')) return;
    btn.classList.add('used');

    const slotIdx = getNextEmptySlotIdx();
    if (slotIdx === -1) return;

    const slots = document.querySelectorAll('.answer-slot');
    slots[slotIdx].textContent = letter;
    slots[slotIdx].classList.add('filled');

    scrambleCurrent.push({ letter: letter, btnIdx: idx, slotIdx: slotIdx });

    // Check if all non-space slots filled
    const totalLetters = scrambleAnswer.replace(/ /g, '').length;
    if (getFilledCount() === totalLetters) {
        // Build attempt
        let attempt = '';
        for (let i = 0; i < scrambleAnswer.length; i++) {
            if (scrambleAnswer[i] === ' ') {
                attempt += ' ';
            } else {
                attempt += slots[i].textContent;
            }
        }

        stageTotal++;
        if (attempt === scrambleAnswer) {
            playCorrectSound();
            showFloatingFeedback('\u{2B50}');
            streak++;
            stageCorrect++;
            addStars(2);
            markWordLearned(scrambleWords[scrambleIndex].en);
            updateStats();
            updateScrambleScore();
            setTimeout(function() { scrambleIndex++; showScrambleWord(); }, 1000);
        } else {
            playWrongSound();
            showFloatingFeedback('\u{1F504}');
            streak = 0;
            updateStats();
            updateScrambleScore();
            setTimeout(function() {
                scrambleCurrent = [];
                document.querySelectorAll('.scramble-letter').forEach(b => b.classList.remove('used'));
                document.querySelectorAll('.answer-slot:not(.space-slot)').forEach(s => {
                    s.textContent = '';
                    s.classList.remove('filled');
                });
            }, 600);
        }
    }
}

function removeFromSlot(slotIdx) {
    // Find the entry for this slot
    const entryIdx = scrambleCurrent.findIndex(e => e.slotIdx === slotIdx);
    if (entryIdx === -1) return;

    // Remove this and all entries that were placed after it
    const toRemove = scrambleCurrent.splice(entryIdx);
    toRemove.forEach(function(item) {
        const btn = document.querySelectorAll('.scramble-letter')[item.btnIdx];
        if (btn) btn.classList.remove('used');
        const slot = document.querySelectorAll('.answer-slot')[item.slotIdx];
        if (slot) { slot.textContent = ''; slot.classList.remove('filled'); }
    });
}

function scrambleHint() {
    // Reset everything
    scrambleCurrent.forEach(function(item) {
        const btn = document.querySelectorAll('.scramble-letter')[item.btnIdx];
        if (btn) btn.classList.remove('used');
        const slot = document.querySelectorAll('.answer-slot')[item.slotIdx];
        if (slot) { slot.textContent = ''; slot.classList.remove('filled'); }
    });
    scrambleCurrent = [];

    // Find first non-space letter
    let firstLetter = '';
    for (let i = 0; i < scrambleAnswer.length; i++) {
        if (scrambleAnswer[i] !== ' ') { firstLetter = scrambleAnswer[i]; break; }
    }

    const btns = document.querySelectorAll('.scramble-letter');
    for (const btn of btns) {
        if (btn.textContent === firstLetter && !btn.classList.contains('used')) {
            addLetter(btn, firstLetter, parseInt(btn.dataset.idx));
            break;
        }
    }
}

// ========== CATCHER MODE ==========
let catcherRunning = false;
let catcherAnimId;
let playerX, playerDir;
let fallingWords = [];
let catcherTarget;
let catcherWordList, catcherWordIdx;
let catcherWaitingForRound = false;

function startCatcher() {
    showScreen('catcherScreen');
    catcherWordList = shuffle(getCurrentStageWords());
    catcherWordIdx = 0;
    streak = 0;
    updateStats();

    document.getElementById('catcherStageLabel').textContent =
        METHODS[currentMethodIdx].name + ' - שלב ' + (currentStageIdx + 1);
    updateCatcherScore();

    const area = document.getElementById('catcherArea');
    playerX = area.offsetWidth / 2 - 50;
    document.getElementById('playerBasket').style.left = playerX + 'px';
    fallingWords = [];
    catcherRunning = true;
    catcherWaitingForRound = false;
    area.querySelectorAll('.falling-word').forEach(el => el.remove());

    nextCatcherRound();
    catcherLoop();
}

function updateCatcherScore() {
    document.getElementById('catcherScoreLabel').textContent =
        stageCorrect + '/' + stageTotal;
}

function nextCatcherRound() {
    if (!catcherRunning) return;
    catcherWaitingForRound = false;

    if (catcherWordIdx >= catcherWordList.length) {
        stopCatcher();
        finishStage();
        return;
    }

    const word = catcherWordList[catcherWordIdx];
    catcherTarget = word;
    document.getElementById('catcherTarget').textContent = word.he + ' ' + word.emoji;

    const area = document.getElementById('catcherArea');
    const areaW = area.offsetWidth;

    const wrong = shuffle(WORDS.filter(w => w.en !== word.en)).slice(0, 2);
    const allWords = shuffle([word, ...wrong]);

    allWords.forEach(function(w, i) {
        setTimeout(function() {
            if (!catcherRunning) return;
            const el = document.createElement('div');
            el.className = 'falling-word';
            el.textContent = w.en;
            el.style.left = (20 + Math.random() * (areaW - 120)) + 'px';
            el.style.top = '-40px';
            el.style.background = w.en === word.en ?
                'linear-gradient(135deg, #4dff88, #00cc55)' :
                'linear-gradient(135deg, #ff6b9d, #ff4444)';
            el.style.color = '#000';
            area.appendChild(el);
            fallingWords.push({
                el: el,
                x: parseFloat(el.style.left),
                y: -40,
                speed: 1.2 + Math.random() * 0.8,
                isCorrect: w.en === word.en,
                word: w.en
            });
        }, i * 600);
    });

    catcherWordIdx++;
}

function catcherLoop() {
    if (!catcherRunning) return;
    const area = document.getElementById('catcherArea');
    const areaH = area.offsetHeight;
    const areaW = area.offsetWidth;
    const basket = document.getElementById('playerBasket');
    const bLeft = playerX;
    const bRight = playerX + 100;
    const bTop = areaH - 60;

    if (playerDir === 'left') playerX = Math.max(0, playerX - 5);
    if (playerDir === 'right') playerX = Math.min(areaW - 100, playerX + 5);
    basket.style.left = playerX + 'px';

    for (let i = fallingWords.length - 1; i >= 0; i--) {
        const fw = fallingWords[i];
        fw.y += fw.speed;
        fw.el.style.top = fw.y + 'px';

        const fwLeft = fw.x;
        const fwRight = fw.x + fw.el.offsetWidth;
        const fwBottom = fw.y + fw.el.offsetHeight;

        if (fwBottom >= bTop && fw.y < areaH - 10 && fwRight > bLeft && fwLeft < bRight) {
            stageTotal++;
            if (fw.isCorrect) {
                playCorrectSound();
                showFloatingFeedback('\u{2B50}');
                stageCorrect++;
                streak++;
                addStars(2);
                markWordLearned(fw.word);
            } else {
                playWrongSound();
                showFloatingFeedback('\u{274C}');
                streak = 0;
            }
            updateStats();
            updateCatcherScore();
            fw.el.remove();
            fallingWords.splice(i, 1);

            if (!catcherWaitingForRound) {
                catcherWaitingForRound = true;
                setTimeout(function() {
                    fallingWords.forEach(f => f.el.remove());
                    fallingWords = [];
                    nextCatcherRound();
                }, 500);
            }
            break;
        }

        if (fw.y > areaH + 10) {
            fw.el.remove();
            fallingWords.splice(i, 1);
        }
    }

    // If all words fell off screen without catching, count as miss for the correct one
    if (fallingWords.length === 0 && !catcherWaitingForRound && catcherWordIdx > 0 && catcherWordIdx <= catcherWordList.length) {
        // Words all gone - start next round
        catcherWaitingForRound = true;
        setTimeout(function() { nextCatcherRound(); }, 500);
    }

    catcherAnimId = requestAnimationFrame(catcherLoop);
}

function movePlayer(dir, start) {
    if (start) playerDir = dir;
    else if (playerDir === dir) playerDir = null;
}

function stopCatcher() {
    catcherRunning = false;
    cancelAnimationFrame(catcherAnimId);
    playerDir = null;
    const area = document.getElementById('catcherArea');
    area.querySelectorAll('.falling-word').forEach(el => el.remove());
    fallingWords = [];
}

document.addEventListener('keydown', function(e) {
    if (!catcherRunning) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') playerDir = 'left';
    if (e.key === 'ArrowRight' || e.key === 'd') playerDir = 'right';
});
document.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') { if (playerDir === 'left') playerDir = null; }
    if (e.key === 'ArrowRight' || e.key === 'd') { if (playerDir === 'right') playerDir = null; }
});

// ========== MEMORY MODE ==========
let memoryCards, memoryFlipped, memoryMatched, memoryLocked, memoryAttempts, memoryPairsFound;

function startMemory() {
    showScreen('memoryScreen');
    streak = 0;
    memoryAttempts = 0;
    memoryPairsFound = 0;
    updateStats();

    document.getElementById('memoryStageLabel').textContent =
        METHODS[currentMethodIdx].name + ' - שלב ' + (currentStageIdx + 1);
    updateMemoryScore();

    const stageWords = getCurrentStageWords();
    // For memory, use up to 6 words to make 12 cards (4x3 grid)
    const words = shuffle(stageWords).slice(0, Math.min(6, stageWords.length));
    const cards = [];
    words.forEach(function(w) {
        cards.push({ type: 'english', text: w.en, pairId: w.en });
        cards.push({ type: 'hebrew', text: w.he, pairId: w.en });
    });

    memoryCards = shuffle(cards);
    memoryFlipped = [];
    memoryMatched = new Set();
    memoryLocked = false;

    const grid = document.getElementById('memoryGrid');
    grid.innerHTML = '';
    memoryCards.forEach(function(card, i) {
        const div = document.createElement('div');
        div.className = 'memory-card';
        div.dataset.index = i;
        div.innerHTML = '<div class="memory-card-inner">' +
            '<div class="memory-card-front">\u{2753}</div>' +
            '<div class="memory-card-back ' + card.type + '">' + card.text + '</div>' +
            '</div>';
        div.onclick = function() { flipMemoryCard(i); };
        grid.appendChild(div);
    });
}

function updateMemoryScore() {
    document.getElementById('memoryScoreLabel').textContent =
        stageCorrect + '/' + stageTotal;
}

function flipMemoryCard(index) {
    if (memoryLocked) return;
    if (memoryMatched.has(index)) return;
    if (memoryFlipped.includes(index)) return;

    const cardEl = document.querySelectorAll('.memory-card')[index];
    cardEl.classList.add('flipped');
    memoryFlipped.push(index);

    if (memoryFlipped.length === 2) {
        memoryLocked = true;
        const a = memoryFlipped[0], b = memoryFlipped[1];
        const cardA = memoryCards[a];
        const cardB = memoryCards[b];
        memoryAttempts++;

        if (cardA.pairId === cardB.pairId && a !== b) {
            stageTotal++;
            stageCorrect++;
            setTimeout(function() {
                document.querySelectorAll('.memory-card')[a].classList.add('matched');
                document.querySelectorAll('.memory-card')[b].classList.add('matched');
                memoryMatched.add(a);
                memoryMatched.add(b);
                memoryFlipped = [];
                memoryLocked = false;
                memoryPairsFound++;
                playCorrectSound();
                showFloatingFeedback('\u{2B50}');
                streak++;
                addStars(3);
                markWordLearned(cardA.pairId);
                updateStats();
                updateMemoryScore();

                if (memoryMatched.size === memoryCards.length) {
                    // All pairs found - finish with remaining words that weren't in memory
                    // Mark all stage words as tested
                    const stageWords = getCurrentStageWords();
                    const memWords = memoryCards.filter(c => c.type === 'english').map(c => c.pairId);
                    const remaining = stageWords.filter(w => !memWords.includes(w.en));
                    // Add remaining words as auto-correct (they'll get another pass)
                    remaining.forEach(function(w) {
                        stageTotal++;
                        stageCorrect++;
                        markWordLearned(w.en);
                    });
                    updateMemoryScore();
                    setTimeout(function() { finishStage(); }, 500);
                }
            }, 400);
        } else {
            stageTotal++;
            setTimeout(function() {
                document.querySelectorAll('.memory-card')[a].classList.remove('flipped');
                document.querySelectorAll('.memory-card')[b].classList.remove('flipped');
                memoryFlipped = [];
                memoryLocked = false;
                streak = 0;
                updateStats();
                updateMemoryScore();
            }, 800);
        }
    }
}

// ========== TOUCH SUPPORT ==========
document.addEventListener('touchstart', function(e) {
    if (e.target.closest('.catcher-ctrl-btn')) {
        e.preventDefault();
    }
}, { passive: false });

// ========== INIT ==========
renderMenu();

</script>
