<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל משימות</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 220px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1035 0%, #2d1b69 100%);
            display: flex;
            flex-direction: column;
            padding: 28px 0 20px;
            z-index: 50;
            box-shadow: -3px 0 16px rgba(0,0,0,0.18);
        }

        .sidebar-logo {
            padding: 0 22px 28px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .sidebar-logo h1 {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .sidebar-logo p {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            margin-top: 3px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-family: inherit;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-item.active {
            background: rgba(255,255,255,0.15);
            color: white;
            font-weight: 600;
        }

        .nav-item .nav-icon {
            font-size: 1.1rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 16px 12px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* ── Main Layout ── */
        .main-wrapper {
            margin-right: 220px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top Bar ── */
        .topbar {
            background: white;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .topbar-title {
            flex: 1;
            font-size: 1.15rem;
            font-weight: 700;
            color: #16213e;
        }

        .search-box {
            padding: 8px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            background: #f8f9fb;
            width: 220px;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: #533483;
            background: white;
        }

        /* ── Page Content ── */
        .page-content {
            padding: 24px 28px;
            flex: 1;
        }

        /* ── Stats Row ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            transition: box-shadow 0.2s;
        }

        .stat-card:hover {
            box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .stat-icon.purple { background: #ede9f9; }
        .stat-icon.blue   { background: #e3f2fd; }
        .stat-icon.green  { background: #e8f5e9; }
        .stat-icon.red    { background: #fce4ec; }

        .stat-info .stat-number {
            font-size: 1.7rem;
            font-weight: 700;
            color: #16213e;
            line-height: 1;
        }

        .stat-info .stat-label {
            font-size: 0.78rem;
            color: #888;
            margin-top: 3px;
        }

        /* ── Dashboard Grid ── */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            align-items: start;
        }

        /* ── Cards ── */
        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #16213e;
        }

        /* ── Add Task Form ── */
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .form-row input[type="text"] {
            flex: 1;
            min-width: 160px;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-row input[type="text"]:focus {
            outline: none;
            border-color: #533483;
        }

        .form-row input[type="date"],
        .form-row select {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .form-row input[type="date"]:focus,
        .form-row select:focus {
            outline: none;
            border-color: #533483;
        }

        .btn-add {
            padding: 10px 22px;
            background: #533483;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-add:hover { background: #3e2563; }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar select {
            padding: 7px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            background: white;
            cursor: pointer;
        }

        .toolbar select:focus {
            outline: none;
            border-color: #533483;
        }

        /* ── Category Manager ── */
        .category-manager {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .category-manager input {
            padding: 7px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            flex: 1;
            min-width: 120px;
        }

        .category-manager input:focus {
            outline: none;
            border-color: #533483;
        }

        .btn-small {
            padding: 7px 14px;
            background: #ede9f9;
            color: #533483;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-small:hover { background: #d2b4de; }

        /* ── Task List ── */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 460px;
            overflow-y: auto;
            padding-left: 2px;
        }

        .task-list::-webkit-scrollbar { width: 5px; }
        .task-list::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 3px; }
        .task-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        .task-item {
            background: #fafafa;
            border: 1px solid #ececec;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }

        .task-item:hover {
            background: white;
            border-color: #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        .task-item.completed { opacity: 0.55; }
        .task-item.completed .task-title { text-decoration: line-through; }

        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #533483;
            flex-shrink: 0;
        }

        .task-content { flex: 1; min-width: 0; }

        .task-title {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .task-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .task-badge {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 500;
        }

        .badge-category        { background: #e3f2fd; color: #1565c0; }
        .badge-priority-high   { background: #fce4ec; color: #c62828; }
        .badge-priority-medium { background: #fff3e0; color: #e65100; }
        .badge-priority-low    { background: #e8f5e9; color: #2e7d32; }

        .task-due { font-size: 0.72rem; color: #999; }
        .task-due.overdue { color: #c62828; font-weight: 600; }

        .task-actions { display: flex; gap: 5px; flex-shrink: 0; }

        .btn-icon {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .btn-edit   { background: #e3f2fd; color: #1565c0; }
        .btn-edit:hover   { background: #bbdefb; }
        .btn-delete { background: #fce4ec; color: #c62828; }
        .btn-delete:hover { background: #f8bbd0; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #bbb;
        }

        .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 8px; }

        /* ── Right Panel Charts ── */
        .charts-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chart-container {
            position: relative;
        }

        .donut-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
        }

        .donut-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .donut-pct {
            font-size: 1.6rem;
            font-weight: 700;
            color: #533483;
            line-height: 1;
        }

        .donut-lbl {
            font-size: 0.7rem;
            color: #888;
            margin-top: 2px;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: #555;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Data Bar (export/import) ── */
        .data-bar {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn-export {
            padding: 8px 16px;
            background: #1b5e20;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-export:hover { background: #2e7d32; }

        .btn-import {
            padding: 8px 16px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-import:hover { background: #1976d2; }

        .hidden-input { display: none; }

        /* ── Edit Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 26px;
            width: 90%;
            max-width: 420px;
            direction: rtl;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }

        .modal h3 { margin-bottom: 18px; color: #16213e; font-size: 1.05rem; }

        .modal-field { margin-bottom: 13px; }

        .modal-field label {
            display: block;
            font-size: 0.82rem;
            color: #555;
            margin-bottom: 4px;
        }

        .modal-field input,
        .modal-field select {
            width: 100%;
            padding: 9px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .modal-field input:focus,
        .modal-field select:focus {
            outline: none;
            border-color: #533483;
        }

        .modal-actions { display: flex; gap: 10px; margin-top: 18px; }

        .btn-save {
            padding: 9px 20px;
            background: #533483;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save:hover { background: #3e2563; }

        .btn-cancel {
            padding: 9px 20px;
            background: #eee;
            color: #333;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-cancel:hover { background: #ddd; }

        /* ── Section label ── */
        .section-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: #f0f0f0;
            margin: 14px 0;
        }

        /* ── Responsive ── */
        @media (max-width: 960px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .charts-panel {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 64px;
            }
            .sidebar-logo p,
            .sidebar-logo h1,
            .nav-item span:not(.nav-icon) {
                display: none;
            }
            .sidebar-logo { padding: 0 10px 20px; }
            .nav-item { justify-content: center; padding: 10px; }
            .main-wrapper { margin-right: 64px; }
            .page-content { padding: 16px; }
            .topbar { padding: 12px 16px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .search-box { width: 140px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>&#x2705; מנהל משימות</h1>
            <p>ארגן את המשימות שלך</p>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" onclick="showSection('tasks')">
                <span class="nav-icon">&#x1F4CB;</span>
                <span>משימות</span>
            </button>
            <button class="nav-item" onclick="showSection('stats')">
                <span class="nav-icon">&#x1F4CA;</span>
                <span>גרפים</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <button class="nav-item" onclick="exportTasks()">
                <span class="nav-icon">&#x1F4BE;</span>
                <span>ייצוא</span>
            </button>
            <button class="nav-item" onclick="document.getElementById('importFile').click()">
                <span class="nav-icon">&#x1F4C2;</span>
                <span>ייבוא</span>
            </button>
            <input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importTasks(event)" />
        </div>
    </aside>

    <!-- Main -->
    <div class="main-wrapper">

        <!-- Top Bar -->
        <div class="topbar">
            <span class="topbar-title" id="pageTitle">לוח בקרה</span>
            <input type="text" class="search-box" id="searchBox" placeholder="&#x1F50D; חיפוש משימות..." oninput="renderTasks()" />
        </div>

        <!-- Page Content -->
        <div class="page-content">

            <!-- Stats Row -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon purple">&#x1F4CB;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">סה"כ משימות</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue">&#x23F3;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="statActive">0</div>
                        <div class="stat-label">פעילות</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">&#x2705;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="statCompleted">0</div>
                        <div class="stat-label">הושלמו</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red">&#x26A0;&#xFE0F;</div>
                    <div class="stat-info">
                        <div class="stat-number" id="statOverdue">0</div>
                        <div class="stat-label">באיחור</div>
                    </div>
                </div>
            </div>

            <!-- Dashboard Grid -->
            <div class="dashboard-grid">

                <!-- Left: Task Management -->
                <div style="display:flex;flex-direction:column;gap:18px;">

                    <!-- Add Task Card -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">&#x2795; הוספת משימה חדשה</span>
                        </div>
                        <div class="form-row">
                            <input type="text" id="taskTitle" placeholder="שם המשימה..." />
                            <button class="btn-add" onclick="addTask()">הוסף</button>
                        </div>
                        <div class="form-row">
                            <select id="taskCategory">
                                <option value="">ללא קטגוריה</option>
                            </select>
                            <select id="taskPriority">
                                <option value="low">עדיפות נמוכה</option>
                                <option value="medium">עדיפות בינונית</option>
                                <option value="high">עדיפות גבוהה</option>
                            </select>
                            <input type="date" id="taskDueDate" />
                        </div>

                        <div class="divider"></div>

                        <div class="section-label">קטגוריות</div>
                        <div class="category-manager">
                            <input type="text" id="newCategory" placeholder="קטגוריה חדשה..." />
                            <button class="btn-small" onclick="addCategory()">הוסף קטגוריה</button>
                        </div>
                    </div>

                    <!-- Task List Card -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">&#x1F4CB; רשימת משימות</span>
                        </div>

                        <!-- Toolbar -->
                        <div class="toolbar">
                            <select id="filterCategory" onchange="renderTasks()">
                                <option value="">כל הקטגוריות</option>
                            </select>
                            <select id="filterStatus" onchange="renderTasks()">
                                <option value="">הכל</option>
                                <option value="active">פעילות</option>
                                <option value="completed">הושלמו</option>
                            </select>
                            <select id="sortBy" onchange="renderTasks()">
                                <option value="created">לפי תאריך יצירה</option>
                                <option value="dueDate">לפי תאריך יעד</option>
                                <option value="priority">לפי עדיפות</option>
                                <option value="alpha">לפי א-ב</option>
                            </select>
                        </div>

                        <div class="task-list" id="taskList"></div>
                    </div>
                </div>

                <!-- Right: Charts Panel -->
                <div class="charts-panel">

                    <!-- Donut Chart: Completion -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">&#x1F4CA; אחוז השלמה</span>
                        </div>
                        <div class="chart-container">
                            <div class="donut-wrap">
                                <canvas id="completionChart"></canvas>
                                <div class="donut-center">
                                    <div class="donut-pct" id="completionPct">0%</div>
                                    <div class="donut-lbl">הושלמו</div>
                                </div>
                            </div>
                        </div>
                        <div class="chart-legend">
                            <div class="legend-item">
                                <div class="legend-dot" style="background:#533483"></div>
                                <span>הושלמו</span>
                            </div>
                            <div class="legend-item">
                                <div class="legend-dot" style="background:#e0d6f5"></div>
                                <span>פעילות</span>
                            </div>
                        </div>
                    </div>

                    <!-- Bar Chart: Priority -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">&#x1F525; התפלגות עדיפויות</span>
                        </div>
                        <div class="chart-container" style="position:relative;height:160px;">
                            <canvas id="priorityChart"></canvas>
                        </div>
                    </div>

                    <!-- Bar Chart: Category -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">&#x1F3F7;&#xFE0F; משימות לפי קטגוריה</span>
                        </div>
                        <div class="chart-container" style="position:relative;height:160px;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>

                </div><!-- /charts-panel -->
            </div><!-- /dashboard-grid -->

        </div><!-- /page-content -->
    </div><!-- /main-wrapper -->

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>&#x270F;&#xFE0F; עריכת משימה</h3>
            <input type="hidden" id="editId" />
            <div class="modal-field">
                <label>שם המשימה</label>
                <input type="text" id="editTitle" />
            </div>
            <div class="modal-field">
                <label>קטגוריה</label>
                <select id="editCategory"></select>
            </div>
            <div class="modal-field">
                <label>עדיפות</label>
                <select id="editPriority">
                    <option value="low">נמוכה</option>
                    <option value="medium">בינונית</option>
                    <option value="high">גבוהה</option>
                </select>
            </div>
            <div class="modal-field">
                <label>תאריך יעד</label>
                <input type="date" id="editDueDate" />
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="saveEdit()">שמור</button>
                <button class="btn-cancel" onclick="closeModal()">ביטול</button>
            </div>
        </div>
    </div>

    <script>
        // ── State ──────────────────────────────────────────────────
        let tasks      = JSON.parse(localStorage.getItem('tasks')      || '[]');
        let categories = JSON.parse(localStorage.getItem('categories') || '["עבודה","אישי","קניות","לימודים"]');

        // ── Chart instances ────────────────────────────────────────
        let completionChartInst = null;
        let priorityChartInst   = null;
        let categoryChartInst   = null;

        // ── Persistence ────────────────────────────────────────────
        function save() {
            localStorage.setItem('tasks',      JSON.stringify(tasks));
            localStorage.setItem('categories', JSON.stringify(categories));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        // ── Navigation ─────────────────────────────────────────────
        function showSection(section) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('pageTitle').textContent =
                section === 'stats' ? 'גרפים וסטטיסטיקות' : 'לוח בקרה';
        }

        // ── Categories ─────────────────────────────────────────────
        function renderCategories() {
            const options = '<option value="">ללא קטגוריה</option>' +
                categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            document.getElementById('taskCategory').innerHTML  = options;
            document.getElementById('editCategory').innerHTML  = options;

            const filterOpts = '<option value="">כל הקטגוריות</option>' +
                categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            document.getElementById('filterCategory').innerHTML = filterOpts;
        }

        function addCategory() {
            const input = document.getElementById('newCategory');
            const name  = input.value.trim();
            if (!name) return;
            if (categories.includes(name)) { alert('קטגוריה זו כבר קיימת'); return; }
            categories.push(name);
            save();
            renderCategories();
            input.value = '';
            updateCharts();
        }

        // ── Tasks ──────────────────────────────────────────────────
        function addTask() {
            const titleEl = document.getElementById('taskTitle');
            const title   = titleEl.value.trim();
            if (!title) return;

            tasks.push({
                id:        generateId(),
                title:     title,
                category:  document.getElementById('taskCategory').value,
                priority:  document.getElementById('taskPriority').value,
                dueDate:   document.getElementById('taskDueDate').value,
                completed: false,
                createdAt: new Date().toISOString()
            });

            save();
            titleEl.value = '';
            document.getElementById('taskDueDate').value = '';
            renderTasks();
            updateCharts();
            titleEl.focus();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) task.completed = !task.completed;
            save();
            renderTasks();
            updateCharts();
        }

        function deleteTask(id) {
            if (!confirm('למחוק את המשימה?')) return;
            tasks = tasks.filter(t => t.id !== id);
            save();
            renderTasks();
            updateCharts();
        }

        function openEdit(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            document.getElementById('editId').value       = id;
            document.getElementById('editTitle').value    = task.title;
            document.getElementById('editCategory').value = task.category;
            document.getElementById('editPriority').value = task.priority;
            document.getElementById('editDueDate').value  = task.dueDate;
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveEdit() {
            const id   = document.getElementById('editId').value;
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            task.title    = document.getElementById('editTitle').value.trim();
            task.category = document.getElementById('editCategory').value;
            task.priority = document.getElementById('editPriority').value;
            task.dueDate  = document.getElementById('editDueDate').value;
            save();
            closeModal();
            renderTasks();
            updateCharts();
        }

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ── Helpers ────────────────────────────────────────────────
        function isOverdue(task) {
            if (!task.dueDate || task.completed) return false;
            return new Date(task.dueDate) < new Date(new Date().toDateString());
        }

        function priorityValue(p) { return { high: 3, medium: 2, low: 1 }[p] || 0; }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleDateString('he-IL');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Render Tasks ───────────────────────────────────────────
        function renderTasks() {
            const search       = document.getElementById('searchBox').value.trim().toLowerCase();
            const filterCat    = document.getElementById('filterCategory').value;
            const filterStatus = document.getElementById('filterStatus').value;
            const sortBy       = document.getElementById('sortBy').value;

            let filtered = tasks.filter(t => {
                if (search && !t.title.toLowerCase().includes(search)) return false;
                if (filterCat && t.category !== filterCat)              return false;
                if (filterStatus === 'active'    &&  t.completed)       return false;
                if (filterStatus === 'completed' && !t.completed)       return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                switch (sortBy) {
                    case 'priority':
                        return priorityValue(b.priority) - priorityValue(a.priority);
                    case 'dueDate':
                        if (!a.dueDate && !b.dueDate) return 0;
                        if (!a.dueDate) return 1;
                        if (!b.dueDate) return -1;
                        return new Date(a.dueDate) - new Date(b.dueDate);
                    case 'alpha':
                        return a.title.localeCompare(b.title, 'he');
                    default:
                        return new Date(b.createdAt) - new Date(a.createdAt);
                }
            });

            const container = document.getElementById('taskList');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">&#x1F4CB;</div>
                        <p>${tasks.length === 0 ? 'אין משימות עדיין. הוסף משימה חדשה!' : 'לא נמצאו משימות התואמות לחיפוש'}</p>
                    </div>`;
                updateStats();
                return;
            }

            const priorityLabels = { high: 'גבוהה', medium: 'בינונית', low: 'נמוכה' };

            container.innerHTML = filtered.map(t => {
                const overdue = isOverdue(t);
                return `
                <div class="task-item ${t.completed ? 'completed' : ''}">
                    <input type="checkbox" class="task-checkbox"
                        ${t.completed ? 'checked' : ''}
                        onchange="toggleTask('${t.id}')" />
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(t.title)}</div>
                        <div class="task-meta">
                            ${t.category ? `<span class="task-badge badge-category">${escapeHtml(t.category)}</span>` : ''}
                            <span class="task-badge badge-priority-${t.priority}">${priorityLabels[t.priority]}</span>
                            ${t.dueDate ? `<span class="task-due ${overdue ? 'overdue' : ''}">${overdue ? '⚠ ' : ''}${formatDate(t.dueDate)}</span>` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon btn-edit"   onclick="openEdit('${t.id}')"   title="ערוך">&#x270F;&#xFE0F;</button>
                        <button class="btn-icon btn-delete" onclick="deleteTask('${t.id}')" title="מחק">&#x1F5D1;&#xFE0F;</button>
                    </div>
                </div>`;
            }).join('');

            updateStats();
        }

        // ── Update Stats ───────────────────────────────────────────
        function updateStats() {
            const total     = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active    = total - completed;
            const overdue   = tasks.filter(t => isOverdue(t)).length;

            document.getElementById('statTotal').textContent     = total;
            document.getElementById('statActive').textContent    = active;
            document.getElementById('statCompleted').textContent = completed;
            document.getElementById('statOverdue').textContent   = overdue;
        }

        // ── Charts ─────────────────────────────────────────────────
        function updateCharts() {
            updateCompletionChart();
            updatePriorityChart();
            updateCategoryChart();
        }

        function updateCompletionChart() {
            const total     = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active    = total - completed;
            const pct       = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('completionPct').textContent = pct + '%';

            const data = total > 0 ? [completed, active] : [0, 1];

            if (completionChartInst) {
                completionChartInst.data.datasets[0].data = data;
                completionChartInst.update();
                return;
            }

            const ctx = document.getElementById('completionChart').getContext('2d');
            completionChartInst = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: data,
                        backgroundColor: ['#533483', '#e0d6f5'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    cutout: '72%',
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    animation: { duration: 600 }
                }
            });
        }

        function updatePriorityChart() {
            const high   = tasks.filter(t => t.priority === 'high').length;
            const medium = tasks.filter(t => t.priority === 'medium').length;
            const low    = tasks.filter(t => t.priority === 'low').length;

            if (priorityChartInst) {
                priorityChartInst.data.datasets[0].data = [high, medium, low];
                priorityChartInst.update();
                return;
            }

            const ctx = document.getElementById('priorityChart').getContext('2d');
            priorityChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['גבוהה', 'בינונית', 'נמוכה'],
                    datasets: [{
                        data: [high, medium, low],
                        backgroundColor: ['#ef5350', '#ffa726', '#66bb6a'],
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, font: { size: 11 } },
                            grid: { color: '#f0f0f0' }
                        },
                        x: { ticks: { font: { size: 11 } }, grid: { display: false } }
                    },
                    animation: { duration: 500 }
                }
            });
        }

        function updateCategoryChart() {
            const catCounts = {};
            categories.forEach(c => { catCounts[c] = 0; });
            tasks.forEach(t => {
                if (t.category && catCounts[t.category] !== undefined) {
                    catCounts[t.category]++;
                }
            });

            const labels = Object.keys(catCounts);
            const data   = Object.values(catCounts);

            const colors = ['#533483','#1565c0','#00838f','#2e7d32','#e65100','#6a1b9a','#c62828','#558b2f'];

            if (categoryChartInst) {
                categoryChartInst.data.labels                        = labels;
                categoryChartInst.data.datasets[0].data              = data;
                categoryChartInst.data.datasets[0].backgroundColor   = labels.map((_, i) => colors[i % colors.length]);
                categoryChartInst.update();
                return;
            }

            const ctx = document.getElementById('categoryChart').getContext('2d');
            categoryChartInst = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data:            data,
                        backgroundColor: labels.map((_, i) => colors[i % colors.length]),
                        borderRadius:    6,
                        borderSkipped:   false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, font: { size: 11 } },
                            grid: { color: '#f0f0f0' }
                        },
                        x: { ticks: { font: { size: 10 } }, grid: { display: false } }
                    },
                    animation: { duration: 500 }
                }
            });
        }

        // ── Export / Import ────────────────────────────────────────
        function exportTasks() {
            const data = JSON.stringify({ tasks, categories }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'tasks-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importTasks(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data.tasks)) {
                        alert('הקובץ לא תקין - לא נמצאו משימות');
                        return;
                    }
                    if (confirm('לייבא ' + data.tasks.length + ' משימות? (המשימות הקיימות יוחלפו)')) {
                        tasks = data.tasks;
                        if (Array.isArray(data.categories)) categories = data.categories;
                        save();
                        renderCategories();
                        renderTasks();
                        updateCharts();
                    }
                } catch (err) {
                    alert('שגיאה בקריאת הקובץ: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ── Init ───────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('taskTitle').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addTask();
            });
        });

        renderCategories();
        renderTasks();
        updateCharts();
    </script>
</body>
</html>
